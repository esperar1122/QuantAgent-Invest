version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: quantagent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: quantagent
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: quantagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass tradingagents123
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
